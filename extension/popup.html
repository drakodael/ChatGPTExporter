<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Export ChatGPT Chat</h1>

  <label class="option">
    <input id="images" type="checkbox">
    <span>
      <strong>Include images</strong>
      <small>Creates a ZIP with conversation.md + images/. Safari may ask once for access to ChatGPT image hosts.</small>
    </span>
  </label>

  <button id="download" type="button">Export Markdown</button>

  <p class="privacy">Local only · active tab only · image host permission is optional · no analytics · no native app</p>
  <p id="status" class="muted">Open a ChatGPT conversation and export it locally.</p>

  <script src="exporter.js"></script>
  <script src="export-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
